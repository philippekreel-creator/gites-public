<style>

#gw_bod_ar_fons td.o{background:var(--occ);color:#7a1d16}
#gw_bod_ar_fons td.f{background:var(--ferme);color:#555}

#gw_bod_ar_fons td.dep-arr{background:linear-gradient(135deg,var(--occ) 48%,#fff 50%,var(--occ) 52%)}

#gw_bod_ar_fons td.today{outline:2px solid #2c7be5;outline-offset:-2px}
#gw_bod_ar_fons .leg{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;
  margin-top:8px;font-size:11px}
#gw_bod_ar_fons .leg span{display:inline-flex;align-items:center;gap:4px}
#gw_bod_ar_fons .sw{width:12px;height:12px;border:1px solid var(--bord);display:inline-block}
#gw_bod_ar_fons .maj{text-align:center;font-size:10px;color:#aaa;margin-top:4px}
@media(max-width:640px){#gw_bod_ar_fons .bloc{flex-basis:100%}}
</style>

<script>

var PERIODES=[{"debut": "2026-01-25", "fin": "2026-01-28", "ferme": false}, {"debut": "2026-02-12", "fin": "2026-02-20", "ferme": false}, {"debut": "2026-02-25", "fin": "2026-02-27", "ferme": false}, {"debut": "2026-03-10", "fin": "2026-03-15", "ferme": false}, {"debut": "2026-03-18", "fin": "2026-03-27", "ferme": false}, {"debut": "2026-03-27", "fin": "2026-03-29", "ferme": false}, {"debut": "2026-04-03", "fin": "2026-04-06", "ferme": false}, {"debut": "2026-04-13", "fin": "2026-04-17", "ferme": false}, {"debut": "2026-04-21", "fin": "2026-04-24", "ferme": false}, {"debut": "2026-04-25", "fin": "2026-04-27", "ferme": false}, {"debut": "2026-05-02", "fin": "2026-05-04", "ferme": false}, {"debut": "2026-05-08", "fin": "2026-05-10", "ferme": false}, {"debut": "2026-05-14", "fin": "2026-05-17", "ferme": false}, {"debut": "2026-05-23", "fin": "2026-05-25", "ferme": false}, {"debut": "2026-06-01", "fin": "2026-06-07", "ferme": false}, {"debut": "2026-06-12", "fin": "2026-06-14", "ferme": false}, {"debut": "2026-06-26", "fin": "2026-07-03", "ferme": false}, {"debut": "2026-07-10", "fin": "2026-07-13", "ferme": false}, {"debut": "2026-07-14", "fin": "2026-07-18", "ferme": false}, {"debut": "2026-07-18", "fin": "2026-07-23", "ferme": false}, {"debut": "2026-07-23", "fin": "2026-07-29", "ferme": false}, {"debut": "2026-07-29", "fin": "2026-08-01", "ferme": false}, {"debut": "2026-08-01", "fin": "2026-08-07", "ferme": false}, {"debut": "2026-08-07", "fin": "2026-08-09", "ferme": false}, {"debut": "2026-08-09", "fin": "2026-08-16", "ferme": false}, {"debut": "2026-08-17", "fin": "2026-08-23", "ferme": false}, {"debut": "2026-08-30", "fin": "2026-09-13", "ferme": false}, {"debut": "2026-09-16", "fin": "2026-09-19", "ferme": false}, {"debut": "2026-09-21", "fin": "2026-09-25", "ferme": false}, {"debut": "2026-09-26", "fin": "2026-09-28", "ferme": false}, {"debut": "2026-09-28", "fin": "2026-10-02", "ferme": false}, {"debut": "2026-10-10", "fin": "2026-10-12", "ferme": false}, {" var NB=3;
var MOIS=['janvier','février','mars','avril','mai','juin','juillet',
'août','septembre','octobre','novembre','décembre'];
var today=new Date();today.setHours(0,0,0,0);
var debutMin=new Date(today.getFullYear(),today.getMonth(),1);
var finMax=debutMin;
PERIODES.forEach(function(p){var d=new Date(p.fin+'T12:00:00');if(d>finMax)finMax=d;});
finMax=new Date(Math.max(finMax,new Date(debutMin.getFullYear()+1,debutMin.getMonth(),1)));
var finMaxMois=new Date(finMax.getFullYear(),finMax.getMonth()+2,1);
var cur=new Date(debutMin);
function iso(y,m,d){return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');}
function etat(dt){
 var d=iso(dt.getFullYear(),dt.getMonth(),dt.getDate());
 var arr=false,dep=false,plein=false,ferme=false;
 for(var i=0;i<PERIODES.length;i++){var p=PERIODES[i];
   if(p.ferme){
     if(d>=p.debut&&d<p.fin)ferme=true;}
   else{
     if(d>p.debut&&d<p.fin)plein=true;
     if(d===p.debut)arr=true;
     if(d===p.fin)dep=true;}}
 if(ferme)return'f';
 if(dep&&arr)return'dep-arr';
 if(dep)return'dep';
 if(arr)return'arr';
 if(plein)return'o';
 return'v';}
function moisHtml(y,m){
 var first=new Date(y,m,1);var off=(first.getDay()+6)%7;
 var dim=new Date(y,m+1,0).getDate();
 var h='<div class="bloc"><div class="titre">'+MOIS[m]+' '+y+'</div>'
      +'<table><tr>'+['L','M','M','J','V','S','D'].map(function(j){return'<th>'+j+'</th>';}).join('')+'</tr><tr>';
 for(var i=0;i<off;i++)h+='<td></td>';
 for(var d=1;d<=dim;d++){
   var dt=new Date(y,m,d);var c=etat(dt);
   var cls=c+(dt<today?' passe':'')+(dt.getTime()===today.getTime()?' today':'');
   h+='<td class="'+cls+'">'+d+'</td>';
   if((off+d)%7===0&&d<dim)h+='</tr><tr>';}
 var tail=(off+dim)%7;if(tail)h+='<td></td>'.repeat(7-tail);
 return h+'</tr></table></div>';}
function render(){
 var h='';
 for(var i=0;i<NB;i++){
   var mm=new Date(cur.getFullYear(),cur.getMonth()+i,1);
   h+=moisHtml(mm.getFullYear(),mm.getMonth());}
 R.querySelector('.cal').innerHTML=h;
 R.querySelector('.pv').disabled=cur<=debutMin;
 R.querySelector('.nx').disabled=cur>=finMaxMois;}
